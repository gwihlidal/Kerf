name: kerf

services:
  # Production: static build served by nginx.
  #   docker compose up -d --build      → http://localhost:8080
  web:
    build:
      context: .
      target: runtime
    image: kerf:latest
    ports:
      - "${KERF_PORT:-8080}:80"
    restart: unless-stopped

  # Development: Vite dev server with hot reload against your local source.
  #   docker compose --profile dev up dev   → http://localhost:5173
  dev:
    profiles: [dev]
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      VITE_USE_POLLING: "true"
    ports:
      - "${KERF_DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      # Keep Linux node_modules in a volume so they never mix with the host's.
      - node_modules:/app/node_modules

volumes:
  node_modules:
